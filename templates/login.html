{% extends "base.html" %}
{% block title %}Log in — Campusly{% endblock %}
{% block content %}
  <div class="auth-shell">
    <div class="auth-card">
      <img class="auth-logo" src="{{ url_for('static', filename='logo.svg') }}" alt="">
      <div class="auth-brand">Campusly</div>
      <p class="auth-sub">Hackathons · Internships · Health · Lost &amp; Found</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>
        </div>
        <button class="btn primary block" type="submit">Log in</button>
      </form>
      <p class="auth-switch">New here? <a href="{{ url_for('signup') }}">Create a student account</a></p>
    </div>
  </div>
{% endblock %}
